[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hrp-research-factory"
version = "0.1.0"
description = "Offline-first, approval-gated HRP Transfer Lab publication workflow"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
agents = ["agno[os,openai,sqlite]>=2.6,<3", "ollama>=0.5", "sqlalchemy[asyncio]>=2,<3"]

[project.scripts]
hrp-factory = "hrp_research_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
