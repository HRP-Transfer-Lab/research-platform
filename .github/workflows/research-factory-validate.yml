name: Research factory M0 validation

on:
  pull_request:
    paths:
      - "components/research-factory/**"
      - "docs/RESEARCH_PUBLICATION_FACTORY_DEVELOPMENT_PLAN_V0_1.md"
      - ".github/workflows/research-factory-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/research-factory
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install factory and tests (no optional model SDKs)
        run: python -m pip install -e ".[dev]"
      - name: Validate source-pinned example
        run: hrp-factory validate configs/TG-COMP-001.json
      - name: Run offline tests
        run: python -m pytest -q

  agno-sdk-construction-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/research-factory
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install optional Agno models (no model API calls)
        run: python -m pip install -e ".[agents,dev]"
      - name: Construct Agno workflows without calling models
        run: python -m pytest tests/test_agno_constructor.py -q
